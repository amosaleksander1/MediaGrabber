name: Upstream check

# MediaGrabber downloads its tools (yt-dlp, ffmpeg, Deno, gallery-dl) from
# third-party release feeds at runtime. This job verifies weekly that every
# URL the app would build still resolves on every supported platform, and
# records the current upstream versions.
#
#   • versions moved      -> commits the updated snapshot to main
#   • an asset disappeared -> opens an issue, because that breaks users
#
# The snapshot is a record, not code, so it is committed directly rather than
# through a pull request: this repo does not let Actions open PRs, and a PR
# to merge every week for a JSON timestamp would only be noise.

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check upstream assets
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_upstream.py | tee check.log
        continue-on-error: true

      - name: Verify the platform matrix still resolves correctly
        run: python tests/test_platform_matrix.py

      - name: Verify media-mode URL handling
        run: python tests/test_media_urls.py

      - name: Verify the browser bridge
        run: python tests/test_bridge.py

      - name: Verify the menu input decoding and click map
        run: python tests/test_menu.py

      - name: Verify the command line
        run: python tests/test_cli.py

      - name: Commit the snapshot when upstream versions moved
        if: steps.check.outcome == 'success'
        run: |
          if git diff --quiet -- .github/upstream-versions.json; then
            echo "Upstream versions unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/upstream-versions.json
          git commit -m "Refresh the upstream tool version snapshot" \
                     -m "Every download URL still resolves on all five platform targets."
          git push

      - name: Open an issue when an upstream asset disappeared
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('check.log', 'utf8');
            const title = 'Upstream asset missing — downloads will break';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'upstream',
            });
            const body = [
              'The weekly upstream check could not resolve one or more download URLs.',
              'Users on the affected platform(s) will fail to install that tool.',
              '',
              '```',
              log.slice(-6000),
              '```',
            ].join('\n');
            if (existing.data.some(i => i.title === title)) {
              const issue = existing.data.find(i => i.title === title);
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['upstream'],
              });
            }

      - name: Fail the run if assets are missing
        if: steps.check.outcome == 'failure'
        run: exit 1
