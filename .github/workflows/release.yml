name: Release

# Push a version tag to cut a release:
#
#     git tag -a v3.0.0 -m "..."  &&  git push --follow-tags
#
# Each platform gets its own archive containing only the binary it can run,
# so nobody downloads assets for an OS they do not use. The changelog is
# generated from the commits since the previous tag and written into the
# GitHub Release — this repo deliberately has no CHANGELOG.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v3.0.0)"
        required: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyflakes
      - name: Lint
        run: pyflakes mediagrabber/*.py mediagrabber.py bridge_main.py scripts/*.py tests/*.py
      - name: Platform matrix
        run: python tests/test_platform_matrix.py
      - name: Media-mode URL handling
        run: python tests/test_media_urls.py
      - name: Browser bridge
        run: python tests/test_bridge.py

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            binary: MediaGrabber.exe
          - os: macos-15          # Apple Silicon runner (macos-14 is deprecated)
            target: macos-arm64
            binary: MediaGrabber
          - os: macos-15-intel    # Intel runner (macos-13 was retired)
            target: macos-x64
            binary: MediaGrabber
          - os: ubuntu-22.04      # older glibc = wider compatibility
            target: linux-x64
            binary: MediaGrabber

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # On a tag push this is the tag; on a manual run it is the tag typed
          # into the dispatch form, so the build matches what gets released.
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build
        run: >
          python -m PyInstaller --onefile --console --name MediaGrabber
          --clean --noconfirm --distpath dist
          --collect-submodules mediagrabber
          mediagrabber.py

      # The browser launches this one directly, so it must be its own program:
      # Chrome and Firefox pass different arguments, and stdout is the protocol.
      - name: Build the browser bridge
        run: >
          python -m PyInstaller --onefile --console --name mediagrabber-bridge
          --clean --noconfirm --distpath dist
          --collect-submodules mediagrabber
          bridge_main.py

      - name: Stage archive (POSIX)
        if: runner.os != 'Windows'
        run: |
          mkdir -p stage
          cp dist/${{ matrix.binary }} stage/
          chmod +x stage/${{ matrix.binary }}
          cp dist/mediagrabber-bridge stage/
          chmod +x stage/mediagrabber-bridge
          cp -r extension stage/
          cp README.md LICENSE stage/
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp run.command stage/
            chmod +x stage/run.command
          else
            cp run.sh stage/
            chmod +x stage/run.sh
          fi
          cd stage && zip -r ../MediaGrabber-${{ matrix.target }}.zip .

      - name: Stage archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item dist/${{ matrix.binary }} stage/
          Copy-Item dist/mediagrabber-bridge.exe stage/
          Copy-Item -Recurse extension stage/extension
          Copy-Item README.md,LICENSE,RUN.bat stage/
          Compress-Archive -Path stage/* -DestinationPath MediaGrabber-${{ matrix.target }}.zip

      - name: Smoke test the binary
        if: runner.os != 'Windows'
        run: |
          # The menu needs stdin; feeding it "0" proves the binary starts,
          # renders and exits cleanly on this platform.
          printf '0\n' | ./dist/${{ matrix.binary }} || true

      - uses: actions/upload-artifact@v4
        with:
          name: MediaGrabber-${{ matrix.target }}
          path: MediaGrabber-${{ matrix.target }}.zip
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0   # full history so the changelog can be generated

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Package the browser extension
        run: |
          # Chromium loads the folder as-is. Firefox needs its own manifest, so
          # each engine gets an archive that is correct without editing.
          mkdir -p ext-chrome ext-firefox artifacts
          cp -r extension/. ext-chrome/
          rm -f ext-chrome/manifest.firefox.json
          cp -r extension/. ext-firefox/
          mv ext-firefox/manifest.firefox.json ext-firefox/manifest.json
          (cd ext-chrome && zip -qr ../artifacts/MediaGrabber-extension-chrome.zip .)
          (cd ext-firefox && zip -qr ../artifacts/MediaGrabber-extension-firefox.zip .)
          ls -l artifacts

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")

          {
            echo "## What's changed"
            echo
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty=format:'- %s (%h)' "$PREV..$TAG"
            else
              git log --no-merges --pretty=format:'- %s (%h)' "$TAG"
            fi
            echo
            echo
            echo "## Downloads"
            echo
            echo "Pick the one archive for your machine — each contains only the"
            echo "binary that runs there."
            echo
            echo "| Platform | Download |"
            echo "| --- | --- |"
            echo "| Windows (64-bit) | \`MediaGrabber-windows-x64.zip\` |"
            echo "| macOS — Apple Silicon (M1/M2/M3/M4) | \`MediaGrabber-macos-arm64.zip\` |"
            echo "| macOS — Intel | \`MediaGrabber-macos-x64.zip\` |"
            echo "| Linux (x86-64) | \`MediaGrabber-linux-x64.zip\` |"
            echo
            echo "The browser extension is optional and hands your existing"
            echo "login to the app, so no cookie export is needed:"
            echo "\`MediaGrabber-extension-chrome.zip\` /"
            echo "\`MediaGrabber-extension-firefox.zip\` — see *Browser extension*"
            echo "in the README."
            echo
            echo "> **macOS:** the binary is unsigned, so the first launch needs"
            echo "> one extra step — see *First run on macOS* in the README."
            echo
            if [ -n "$PREV" ]; then
              echo "**Full diff:** ${{ github.server_url }}/${{ github.repository }}/compare/$PREV...$TAG"
            fi
          } > RELEASE_NOTES.md

          cat RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: MediaGrabber ${{ github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: artifacts/*.zip
          draft: false
          prerelease: false
